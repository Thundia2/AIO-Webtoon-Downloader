<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Device Sync UI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>/* Layout: a review desk. The page chrome (toolbar, notes) follows the viewer's theme;
   each mocked app window carries the app's own globals.css tokens, light or .dark. */
:root {
  /* Page chrome (viewer theme) */
  --pg-bg: #f3f4f7;
  --pg-panel: #ffffff;
  --pg-fg: #1c2230;
  --pg-dim: #626b7d;
  --pg-line: #dcdfe6;
  --pg-accent: #2e62d9;
  --pg-font: "DM Sans", system-ui, sans-serif;
  --pg-mono: "JetBrains Mono", "Cascadia Code", ui-monospace, monospace;

  /* App tokens, copied verbatim from UI-source/src/styles/globals.css (light) */
  --background: 0 0% 98%;
  --foreground: 220 15% 13%;
  --card: 0 0% 100%;
  --card-foreground: 220 15% 13%;
  --primary: 220 75% 50%;
  --primary-foreground: 0 0% 100%;
  --secondary: 220 10% 93%;
  --secondary-foreground: 220 15% 20%;
  --muted: 220 10% 95%;
  --muted-foreground: 220 8% 46%;
  --accent: 220 10% 90%;
  --accent-foreground: 220 15% 13%;
  --destructive: 0 72% 51%;
  --destructive-foreground: 0 0% 100%;
  --border: 220 10% 88%;
  --input: 220 10% 88%;
  --ring: 220 75% 50%;
  --radius: 0.5rem;
  --success: 142 60% 40%;
  --warning: 38 92% 50%;
  --info: 200 80% 50%;
  /* Candidate new token for "will copy" (only used by the teal / violet palettes) */
  --sync-teal: 178 72% 32%;
  --sync-violet: 262 62% 56%;
  /* Tailwind orange-500, the Library "N new" badge */
  --new-orange: 25 95% 53%;
  /* amber edge used to lift warn segments to 3:1 on white */
  --warn-edge: 32 95% 36%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pg-bg: #14171d; --pg-panel: #1b1f27; --pg-fg: #e3e7ee; --pg-dim: #939bab; --pg-line: #2c323d; --pg-accent: #6b9bf0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pg-bg: #14171d; --pg-panel: #1b1f27; --pg-fg: #e3e7ee; --pg-dim: #939bab; --pg-line: #2c323d; --pg-accent: #6b9bf0;
  color-scheme: dark;
}
.app.dk {
  color-scheme: dark;
  --background: 224 15% 10%;
  --foreground: 210 15% 90%;
  --card: 224 15% 13%;
  --card-foreground: 210 15% 90%;
  --primary: 217 75% 58%;
  --primary-foreground: 0 0% 100%;
  --secondary: 224 12% 18%;
  --secondary-foreground: 210 15% 85%;
  --muted: 224 12% 16%;
  --muted-foreground: 220 8% 55%;
  --accent: 224 12% 20%;
  --accent-foreground: 210 15% 90%;
  --destructive: 0 62% 55%;
  --destructive-foreground: 0 0% 100%;
  --border: 224 12% 20%;
  --input: 224 12% 20%;
  --ring: 217 75% 58%;
  --success: 142 55% 48%;
  --warning: 38 92% 55%;
  --info: 200 75% 55%;
  --sync-teal: 175 60% 45%;
  --sync-violet: 262 80% 72%;
  --warn-edge: 38 92% 55%;
}

/* ── Strip palettes (the open colour question) ── */
.app { --st-synced: var(--success); --st-push: var(--primary); --st-warn: var(--warning); --st-delete: var(--destructive); --st-absent: var(--muted-foreground); --st-other: var(--muted-foreground); --synced-alpha: 1; }
.pal-teal .app { --st-push: var(--sync-teal); }
.pal-violet .app { --st-push: var(--sync-violet); }
.pal-orange .app { --st-push: var(--new-orange); }
.quiet .app { --st-synced: var(--foreground); --synced-alpha: .22; }

/* ── Page chrome ── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--pg-bg); color: var(--pg-fg); font-family: var(--pg-font); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.desk-top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--pg-bg);
  padding-block: 12px 10px; border-bottom: 1px solid var(--pg-line); display: flex; flex-direction: column; gap: 10px;
}
.desk-row { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.desk-title { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; margin: 0; }
.desk-sub { color: var(--pg-dim); font-size: 12.5px; }
.seg-ctl { display: inline-flex; border: 1px solid var(--pg-line); border-radius: 8px; overflow: hidden; background: var(--pg-panel); }
.seg-ctl button { font: inherit; font-size: 12.5px; border: 0; background: transparent; color: var(--pg-fg); padding: 5px 10px; cursor: pointer; }
.seg-ctl button + button { border-left: 1px solid var(--pg-line); }
.seg-ctl button[aria-pressed="true"] { background: var(--pg-accent); color: #fff; }
.seg-ctl button:focus-visible, .scr-nav button:focus-visible { outline: 2px solid var(--pg-accent); outline-offset: -2px; }
.ctl-label { font-size: 11.5px; color: var(--pg-dim); margin-right: 6px; }
.scr-nav { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.scr-nav button { font: inherit; font-size: 12.5px; white-space: nowrap; border: 1px solid transparent; background: transparent; color: var(--pg-dim); padding: 4px 9px; border-radius: 7px; cursor: pointer; }
.scr-nav button[aria-current="true"] { background: var(--pg-panel); border-color: var(--pg-line); color: var(--pg-fg); font-weight: 600; }
.dir-pitch { max-width: 78ch; margin: 16px 0 6px; font-size: 13.5px; line-height: 1.55; }
.dir-pitch b { font-weight: 650; }
.scr-head { margin: 22px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.scr-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
.scr-head p { margin: 0; color: var(--pg-dim); font-size: 12.5px; max-width: 80ch; }
.frames { display: flex; flex-direction: column; gap: 14px; }
.frame-wrap { overflow-x: auto; padding-bottom: 4px; }
.frame-cap { font-size: 11.5px; color: var(--pg-dim); margin: 0 0 4px; font-family: var(--pg-mono); }
.note-list { margin: 8px 0 0; padding-left: 18px; color: var(--pg-dim); font-size: 12.5px; line-height: 1.55; max-width: 84ch; }

/* ── App frame ── */
.app {
  font-family: "DM Sans", system-ui, sans-serif; font-size: 14px; color: hsl(var(--foreground)); background: hsl(var(--background));
  border: 1px solid var(--pg-line); border-radius: 10px; overflow: hidden; display: flex; position: relative; flex-shrink: 0;
  -webkit-font-smoothing: antialiased;
}
.app *, .app *::before, .app *::after { border-color: hsl(var(--border)); }
.app :focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
.app .rail { width: 64px; flex-shrink: 0; border-right: 1px solid hsl(var(--border)); background: hsl(var(--card) / .5); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; }
.app .rail-logo { width: 40px; height: 40px; border-radius: 8px; background: hsl(var(--primary) / .1); margin-bottom: 16px; display: grid; place-items: center; color: hsl(var(--primary)); font-weight: 800; font-size: 13px; }
.app .rail-logo.on { background: hsl(var(--primary) / .15); box-shadow: 0 0 0 1px hsl(var(--primary) / .4); }
.app .rail-btn { position: relative; width: 48px; height: 48px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: hsl(var(--muted-foreground)); }
.app .rail-btn span { font-size: 9px; margin-top: 2px; font-weight: 500; }
.app .rail-btn.on { background: hsl(var(--primary) / .1); color: hsl(var(--primary)); }
.app .rail-btn.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 9999px 9999px 0; background: hsl(var(--primary)); }
.app .rail-badge { position: absolute; top: -2px; right: -2px; min-width: 16px; height: 16px; border-radius: 9999px; background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; font-variant-numeric: tabular-nums; }
.app .rail-dot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 9999px; }
.app .rail-dot.red { background: hsl(var(--destructive)); }
.app .rail-dot.pulse { background: hsl(var(--primary)); box-shadow: 0 0 0 0 hsl(var(--primary) / .6); animation: pulse 1.6s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 hsl(var(--primary) / .55); } 80%, 100% { box-shadow: 0 0 0 7px hsl(var(--primary) / 0); } }
.app .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.app .topbar { display: flex; align-items: center; padding: 12px 20px; border-bottom: 1px solid hsl(var(--border)); background: hsl(var(--card) / .3); flex-shrink: 0; }
.app .topbar h1 { font-size: 14px; font-weight: 600; letter-spacing: .025em; margin: 0; }
.app .content { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ── Primitives (mirrors components/ui/primitives.jsx) ── */
.app .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 6px; font: inherit; font-weight: 500; font-size: 14px; height: 36px; padding: 0 16px; border: 0; cursor: pointer; white-space: nowrap; transition: background-color .15s, color .15s; }
.app .btn svg { width: 16px; height: 16px; }
.app .btn-sm { height: 32px; padding: 0 12px; font-size: 12px; }
.app .btn-sm svg { width: 14px; height: 14px; }
.app .btn-xs { height: 26px; padding: 0 9px; font-size: 11.5px; gap: 5px; border-radius: 5px; }
.app .btn-xs svg { width: 13px; height: 13px; }
.app .btn-icon { width: 32px; padding: 0; }
.app .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.app .btn-primary:hover { background: hsl(var(--primary) / .9); }
.app .btn-secondary { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); }
.app .btn-secondary:hover { background: hsl(var(--secondary) / .8); }
.app .btn-outline { background: transparent; color: hsl(var(--foreground)); box-shadow: inset 0 0 0 1px hsl(var(--input)); }
.app .btn-outline:hover, .app .btn-ghost:hover { background: hsl(var(--accent)); }
.app .btn-ghost { background: transparent; color: hsl(var(--foreground)); }
.app .btn-destructive { background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground)); }
.app .btn-danger-outline { background: transparent; color: hsl(var(--destructive)); box-shadow: inset 0 0 0 1px hsl(var(--destructive) / .45); }
.app .btn-danger-outline:hover { background: hsl(var(--destructive) / .08); }
.app .btn[disabled], .app .btn.disabled { opacity: .5; pointer-events: none; }
.app .input, .app .select { height: 36px; width: 100%; border-radius: 6px; border: 1px solid hsl(var(--input)); background: hsl(var(--background)); color: hsl(var(--foreground)); font: inherit; font-size: 14px; padding: 0 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .04); display: flex; align-items: center; }
.app .input.sm, .app .select.sm { height: 30px; font-size: 12.5px; padding: 0 9px; }
.app .input.mono { font-family: "JetBrains Mono", monospace; font-size: 12px; }
.app .select { justify-content: space-between; gap: 8px; }
.app .select svg { width: 14px; height: 14px; color: hsl(var(--muted-foreground)); flex-shrink: 0; }
.app .switch { width: 36px; height: 20px; border-radius: 9999px; background: hsl(var(--input)); position: relative; flex-shrink: 0; border: 0; padding: 0; cursor: pointer; }
.app .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 9999px; background: hsl(var(--background)); box-shadow: 0 2px 4px rgb(0 0 0 / .2); transition: transform .15s; }
.app .switch.on { background: hsl(var(--primary)); }
.app .switch.on::after { transform: translateX(16px); }
.app .cbx { width: 16px; height: 16px; border-radius: 4px; border: 1px solid hsl(var(--primary)); background: hsl(var(--background)); display: inline-grid; place-items: center; flex-shrink: 0; cursor: pointer; padding: 0; color: hsl(var(--primary-foreground)); }
.app .cbx.on, .app .cbx.mixed { background: hsl(var(--primary)); }
.app .cbx svg { width: 10px; height: 10px; }
.app .cbx.pending { opacity: .55; }
.app .cbx.locked { border-color: hsl(var(--muted-foreground) / .5); background: hsl(var(--muted)); cursor: not-allowed; }
.app .cbx.locked.on { background: hsl(var(--muted-foreground) / .5); }
.app .cbx.danger.on { background: hsl(var(--destructive)); border-color: hsl(var(--destructive)); }
.app .cbx.danger { border-color: hsl(var(--destructive)); }
.app .radio { width: 16px; height: 16px; border-radius: 9999px; border: 1px solid hsl(var(--primary)); display: inline-grid; place-items: center; flex-shrink: 0; }
.app .radio.on::after { content: ""; width: 8px; height: 8px; border-radius: 9999px; background: hsl(var(--primary)); }
.app .card { border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: hsl(var(--card-foreground)); box-shadow: 0 1px 2px rgb(0 0 0 / .04); }
.app .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 9999px; border: 1px solid; padding: 1px 8px; font-size: 11px; font-weight: 500; white-space: nowrap; line-height: 16px; }
.app .badge svg { width: 11px; height: 11px; }
.app .b-primary { background: hsl(var(--primary) / .1); color: hsl(var(--primary)); border-color: hsl(var(--primary) / .2); }
.app .b-success { background: hsl(var(--success) / .1); color: hsl(var(--success)); border-color: hsl(var(--success) / .25); }
.app .b-warning { background: hsl(var(--warning) / .12); color: hsl(32 90% 34%); border-color: hsl(var(--warning) / .3); }
.app.dk .b-warning { color: hsl(var(--warning)); }
.app .b-destructive { background: hsl(var(--destructive) / .1); color: hsl(var(--destructive)); border-color: hsl(var(--destructive) / .25); }
.app .b-info { background: hsl(var(--info) / .1); color: hsl(200 85% 34%); border-color: hsl(var(--info) / .25); }
.app.dk .b-info { color: hsl(var(--info)); }
.app .b-muted { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); border-color: hsl(var(--secondary)); }
.app .section-h { display: flex; align-items: center; gap: 12px; padding: 16px 0 8px; }
.app .section-h span { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); }
.app .section-h::after { content: ""; flex: 1; height: 1px; background: hsl(var(--border)); }
.app .mono { font-family: "JetBrains Mono", "Cascadia Code", monospace; font-variant-numeric: tabular-nums; }
.app .num { font-variant-numeric: tabular-nums; }
.app .dim { color: hsl(var(--muted-foreground)); }
.app .ok { color: hsl(var(--success)); }
.app .bad { color: hsl(var(--destructive)); }
.app .warn-t { color: hsl(32 90% 36%); }
.app.dk .warn-t { color: hsl(var(--warning)); }
.app .info-t { color: hsl(200 85% 36%); }
.app.dk .info-t { color: hsl(var(--info)); }
.app .pri { color: hsl(var(--primary)); }
.app .ic { width: 16px; height: 16px; flex-shrink: 0; }
.app .ic-s { width: 14px; height: 14px; flex-shrink: 0; }
.app .ic-xs { width: 12px; height: 12px; flex-shrink: 0; }
.app .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.app .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.app .grow { flex: 1; min-width: 0; }
.app .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .t11 { font-size: 11px; } .app .t12 { font-size: 12px; } .app .t125 { font-size: 12.5px; } .app .t13 { font-size: 13px; } .app .t15 { font-size: 15px; } .app .t17 { font-size: 17px; }
.app .fw6 { font-weight: 600; } .app .fw7 { font-weight: 700; }
.app .hr { height: 1px; background: hsl(var(--border)); }
.app .spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.app .kbd-note { font-size: 11.5px; color: hsl(var(--muted-foreground)); display: flex; align-items: center; gap: 6px; }
.app .callout { border-radius: 8px; padding: 10px 12px; display: flex; gap: 10px; font-size: 12.5px; line-height: 1.45; }
.app .callout svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
.app .co-info { background: hsl(var(--info) / .08); border: 1px solid hsl(var(--info) / .25); }
.app .co-warn { background: hsl(var(--warning) / .09); border: 1px solid hsl(var(--warning) / .3); }
.app .co-bad { background: hsl(var(--destructive) / .07); border: 1px solid hsl(var(--destructive) / .3); }
.app .co-muted { background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); }
.app .co-ok { background: hsl(var(--success) / .08); border: 1px solid hsl(var(--success) / .25); }
.app .scrim { position: absolute; inset: 0; background: hsl(224 15% 6% / .45); z-index: 20; }
.app .scrim.blur { backdrop-filter: blur(2px); }
.app .menu-pop { position: absolute; z-index: 30; border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); box-shadow: 0 10px 30px rgb(0 0 0 / .18); padding: 4px; }
.app .menu-pop .mi { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 5px; font-size: 12.5px; }
.app .menu-pop .mi:hover { background: hsl(var(--accent)); }

/* ── Settings shell (mirrors SettingsTab two-pane) ── */
.app .set-wrap { display: flex; height: 100%; flex-direction: column; }
.app .set-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
.app .set-nav { width: 176px; flex-shrink: 0; border-right: 1px solid hsl(var(--border)); padding: 12px 8px; overflow: auto; }
.app.wide .set-nav { width: 208px; }
.app .set-nav .ni { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; margin-bottom: 2px; font-size: 13px; font-weight: 600; }
.app .set-nav .ni .tile { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: hsl(var(--secondary)); }
.app .set-nav .ni .tile svg { width: 14px; height: 14px; }
.app .set-nav .ni .cnt { margin-left: auto; font-size: 10px; color: hsl(var(--muted-foreground)); }
.app .set-nav .ni.on { background: hsl(var(--primary) / .12); color: hsl(var(--primary)); }
.app .set-nav .ni.on .tile { background: hsl(var(--primary) / .18); }
.app .set-nav .ni.on::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 0 9999px 9999px 0; background: hsl(var(--primary)); }
.app .set-pane { flex: 1; min-width: 0; overflow: auto; padding: 20px 26px 28px; }
.app .set-pane-inner { max-width: 760px; }
.app .set-h2 { display: flex; align-items: center; gap: 11px; font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin: 0; }
.app .set-h2 .tile { width: 34px; height: 34px; border-radius: 9px; background: hsl(var(--primary) / .12); color: hsl(var(--primary)); display: grid; place-items: center; }
.app .set-h2 .tile svg { width: 19px; height: 19px; }
.app .set-desc { margin: 8px 0 4px; font-size: 12.5px; color: hsl(var(--muted-foreground)); }
.app .set-foot { flex-shrink: 0; padding: 16px; border-top: 1px solid hsl(var(--border)); display: flex; gap: 8px; background: hsl(var(--background) / .8); }
.app .srow { display: flex; align-items: flex-start; gap: 12px; padding: 9px 0; }
.app .srow .lbl { flex: 1; min-width: 0; }
.app .srow .lbl b { display: block; font-size: 13.5px; font-weight: 500; }
.app .srow .lbl small { display: block; font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 2px; line-height: 1.4; }
.app .srow .ctl { flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
.app .persist-note { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: hsl(var(--muted-foreground)); padding: 4px 0 6px; }
.app .persist-note svg { width: 12px; height: 12px; }
.app .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.app .chip { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid hsl(var(--border)); font-size: 12px; background: hsl(var(--background)); }
.app .chip.on { border-color: hsl(var(--primary) / .5); background: hsl(var(--primary) / .08); color: hsl(var(--primary)); }
.app .chip svg { width: 12px; height: 12px; }
.app .presetbar { display: flex; gap: 4px; flex-wrap: wrap; }
.app .seg-group { display: inline-flex; border-radius: 6px; box-shadow: inset 0 0 0 1px hsl(var(--input)); overflow: hidden; }
.app .seg-group > span { padding: 0 10px; height: 28px; display: inline-flex; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; border-left: 1px solid hsl(var(--input)); }
.app .seg-group > span:first-child { border-left: 0; }
.app .seg-group > span.on { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }

/* ── Chapter Strip ── */

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const I = (n, cls = "ic") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ""}</svg>`;

const DASH = `<svg viewBox="0 0 10 10" fill="none"><path d="M2 5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const cbx = (state = "off", extra = "") => `<button type="button" class="cbx ${state} ${extra}" role="checkbox" aria-checked="${state === "on" ? "true" : state === "mixed" ? "mixed" : "false"}" data-cbx>${state === "on" ? CHECK : state === "mixed" ? DASH : ""}</button>`;

const badge = (label, v = "muted", icon = "") => `<span class="badge b-${v}">${icon ? I(icon) : ""}${esc(label)}</span>`;
const selectBox = (label, cls = "") => `<div class="select ${cls}"><span class="trunc">${label}</span>${I("chevron-down")}</div>`;
const segGroup = (opts, on) => `<span class="seg-group">${opts.map((o) => `<span class="${o == on ? "on" : ""}">${o}</span>`).join("")}</span>`;

const STATE_WORD = { synced: "on target", push: "will copy", warn: "needs a decision", delete: "will remove", absent: "not copied", other: "volumes / unparsed" };
function strip(segs, size = "", target = "Galaxy Tab S9") {
  return `<div class="strip ${size}" role="img" aria-label="Chapter strip">${segs.map((s) => {
    const range = s.from ? (s.from === s.to ? s.from : `${s.from}–${s.to}`) : `${s.count} files`;
    const word = s.state === "synced" ? `on ${target}` : STATE_WORD[s.state];
    return `<span class="seg ${s.state}" style="flex-grow:${s.count}" title="${esc(range + " · " + word + " (" + s.count + ")")}"></span>`;
  }).join("")}</div>`;
}
function legend(compact) {
  const items = [["synced", "On target"], ["push", "Will copy"], ["warn", "Needs a decision"], ["delete", "Will remove"], ["absent", "Not copied"], ["other", "Volumes / other"]];

}
function gauge(c, tall) {
  const usedPct = (c.used / c.total) * 100, ghostPct = (c.needed / c.total) * 100, resPct = (c.reserve / c.total) * 100;

}

  function detailGroups(o = {}) {
    return DETAIL_GROUPS.map((g) => {
      const open = g.id === "replace" || (g.id === "push" && o.openPush);
      const rows = open ? g.rows.slice(0, g.id === "push" ? 6 : 10).map((r) => `<div class="file-row">${cbx(r.sel ? "on" : "off")}<span class="mono" style="width:62px">${r.label}</span><span class="grow trunc dim">${esc(r.note || r.name)}</span><span class="mono t11">${r.size ? fmtBytes(r.size) : ""}</span></div>`).join("") + (g.id === "push" ? `<div class="show-more">Show 9 more</div>` : "") : "";
      const tone = g.id === "push" ? "push" : g.id === "replace" ? "warn" : g.id === "rename" ? "other" : "synced";
      return `<div class="grp-h" style="position:static;background:transparent">${g.state === "none" ? `<span style="width:16px"></span>` : cbx(g.state)}${I(open ? "chevron-down" : "chevron-right", "ic-s dim")}<span class="seg ${tone}" style="width:10px;height:10px;border-radius:3px;display:inline-block"></span><span>${g.title}</span><span class="mono dim t12">${g.count}</span><span class="grow"></span><span class="t11 dim">${g.hint}</span><span class="mono t11" style="width:56px;text-align:right">${g.bytes ? fmtBytes(g.bytes) : ""}</span></div>${rows}`;
    }).join("") + `<div class="grp-h" style="position:static;background:transparent"><span style="width:16px"></span>${I("chevron-down", "ic-s dim")}<span class="warn-t">${I("alert-triangle", "ic-s")}</span><span>Anomalies</span><span class="mono dim t12">1</span></div><div class="file-row" style="padding-left:40px"><span class="grow dim">Ch.302 and Ch.303 on Galaxy Tab S9 are smaller than the PC copies. They may be older scans.</span>${btn("Acknowledge", "ghost", "xs")}</div>`;
  }

  function reviewDialog(ctx, o = {}) {
    const w = ctx.wide ? 720 : 660;
    const grp = (g, i) => `<div class="row" style="padding:7px 0;border-bottom:1px solid hsl(var(--border) / .7)">${cbx(g.state)}<span class="seg ${g.kind === "delete" ? "delete" : g.kind === "replace" ? "warn" : "push"}" style="width:10px;height:10px;border-radius:3px;display:inline-block"></span><span class="grow t13">${g.title}${g.loss ? ` <span class="bad">${I("alert-triangle", "ic-xs")}</span>` : ""}</span><span class="mono t12 dim">${g.series} series</span><span class="mono t12" style="width:78px;text-align:right;white-space:nowrap">${g.files} files</span><span class="mono t12" style="width:60px;text-align:right">${g.bytes ? fmtBytes(g.bytes) : "—"}</span>${I("chevron-right", "ic-s dim")}</div>`;
    return `<div class="scrim blur"></div><div class="dialog" style="width:${w}px;height:${ctx.tall ? 720 : 540}px">
      <div class="dlg-h"><div class="row"><b class="t15 fw7 grow">Review sync to Galaxy Tab S9</b><span class="mono t11 dim">plan 41 · 14:32</span>${I("x", "ic dim")}</div>
        <div class="row t12 dim" style="margin-top:6px;gap:6px;flex-wrap:wrap">${I("info", "ic-xs")}Planned with guarded removals, cached PC files, and the tablet read back. Change these from Re-check or the settings menu; the plan rebuilds.</div></div>
      <div class="dlg-b">${REVIEW.groups.map(grp).join("")}
        <div class="col" style="gap:8px;margin-top:12px">
          <div class="confirm-strip"><div class="row" style="align-items:flex-start">${cbx(o.ackLoss ? "on" : "off", "danger")}<div class="grow"><b class="fw6">Remove 3 chapters of unOrdinary that aren't on your PC</b><div class="mono t12 dim" style="margin-top:2px">Ch.331 · Ch.332 · Ch.333 — after this they exist nowhere you sync from.</div></div></div></div>
          <div class="callout co-warn"><div class="row grow" style="align-items:flex-start">${cbx(o.ackRepush ? "on" : "off")}<div><b class="fw6">Copy back all 96 chapters of Fly Me to the Moon</b><div class="t12 dim" style="margin-top:2px">This folder was removed on Galaxy Tab S9 since the last sync. Copy it back under:</div>
            <div class="row t12" style="margin-top:6px;gap:12px;flex-wrap:wrap"><span class="row" style="gap:5px">${radio(true)}<span class="mono">Tonikaku Kawaii</span><span class="dim">(previous name)</span></span><span class="row" style="gap:5px">${radio(false)}<span class="mono">Fly Me to the Moon</span><span class="dim">(from the PC)</span></span><span class="row" style="gap:5px">${radio(false)}Don't copy it back</span></div></div></div></div>
          ${o.massDelete ? `<div class="confirm-strip"><div class="row">${cbx("off", "danger")}<b class="fw6">Remove 64 files from Galaxy Tab S9 in one sync</b></div><div class="t12 dim" style="margin:3px 0 0 24px">More than a quarter of what this app synced to Galaxy Tab S9.</div></div>` : ""}
          <div class="row t125" style="padding:6px 2px"><span class="ok">${I("hard-drive", "ic-s")}</span><span class="grow">Fits: needs <span class="mono">6.8 GB</span>, <span class="mono">57.6 GB</span> free, <span class="mono">2 GB</span> kept in reserve</span></div>
        </div></div>
      <div class="dlg-f"><span class="t12 dim grow">${o.ackLoss && o.ackRepush ? "Ready" : `${(o.ackLoss ? 0 : 1) + (o.ackRepush ? 0 : 1)} confirmation${(o.ackLoss ? 0 : 1) + (o.ackRepush ? 0 : 1) > 1 ? "s" : ""} left`}</span>${btn("Cancel", "ghost", "sm")}${btn("Start sync · 452 files", "primary", "sm", "play", o.ackLoss && o.ackRepush ? "" : "disabled")}</div></div>`;
  }

  function connectedSheet(ctx) {
    return `<div class="scrim"></div><div class="sheet" style="width:${ctx.wide ? 560 : 470}px"><div style="padding:12px 16px;border-bottom:1px solid hsl(var(--border))"><div class="row"><span class="ok">${I("tablet")}</span><b class="t15 fw7 grow">Galaxy Tab S9 settings</b>${I("x", "ic dim")}</div><div class="t12 dim" style="margin-top:3px">Only the targets connected now appear here. All targets are in Settings → Sync.</div></div><div style="flex:1;overflow:auto;padding:4px 16px 16px">${targetEditor(T, { narrow: true })}</div></div>`;
  }
  function pruneDialog(ctx) {
    return `<div class="scrim blur"></div><div class="dialog" style="width:520px"><div class="dlg-h"><b class="t15 fw7">Remove folders from Galaxy Tab S9</b><div class="t12 dim" style="margin-top:3px">Only the folders you tick are removed. SHELTER can't be removed here because this app never synced it.</div></div>
      <div class="dlg-b">${DEVICE_ONLY.map((d) => `<div class="row" style="padding:7px 0;border-bottom:1px solid hsl(var(--border) / .7)">${cbx(d.name === "Hunter x Hunter_hid9k2" ? "on" : d.preserved ? "off locked" : "off", d.preserved ? "locked" : "danger")}<span class="mono t12 grow">${esc(d.name)}</span><span class="mono t11 dim">${d.files} files · ${fmtBytes(d.bytes)}</span></div>`).join("")}</div>
      <div class="dlg-f"><span class="grow"></span>${btn("Cancel", "ghost", "sm")}${btn("Remove 1 folder (4.8 GB)", "destructive", "sm", "trash-2")}</div></div>`;
  }

  const P = (ctx, key) => `<div class="corner-card">${promptBody(PROMPTS[key])}</div>`;

  return {
    id: "A", name: "A · Transfer Desk", railPos: "settings",
    // Batch find-sources opens from "Find sources…" in the Only-on section, as a side sheet like detail.
    find: (ctx) => overview(ctx, { deviceOnly: true, tile: "only" }) + `<div class="scrim"></div><div class="sheet" style="width:${ctx.wide ? 680 : 600}px"><div style="padding:12px 16px;border-bottom:1px solid hsl(var(--border))"><div class="row"><span class="pri">${I("search")}</span><b class="t15 fw7 grow">Find sources for 3 folders</b>${I("x", "ic dim")}</div><div class="t12 dim" style="margin-top:3px">Searched each folder's name on Galaxy Tab S9. Edit a query or pin a URL, then queue. 2 of 3 found a source.</div><div class="row t12" style="margin-top:8px;gap:6px">${sw(true)}<span>Only sites with measured quality</span></div></div><div style="flex:1;overflow:auto;padding:12px 16px">${findSourcesTable(true)}</div></div>`,
    pitch: `<b>The approved 2026-09-30 design, refined.</b> The Sync tab is one long series ledger; every row carries its Chapter Strip. Detail opens in a right side sheet (the UpdatesCenter precedent) so the ledger keeps its scroll position. A sticky selection bar sums the plan and opens a <b>Review dialog</b>, the only place Start lives. The connect prompt is a <b>corner card</b> that never blocks the app. Sync sits just above Settings in the rail.`,
    screens: [
      { id: "overview", title: "Sync tab", desc: "Target bar with capacity ghost, filter tiles, ledger. Strips sweep in once when a plan lands.", render: (ctx) => frame(ctx, overview(ctx, { tile: "push" }), "", { sweep: true }) },
      { id: "detail", title: "Series detail", desc: "Right side sheet, grouped by action. Replace is expanded (needs a decision); Copy shows 6 then “Show 9 more” (150 per page in the app).", render: (ctx) => frame(ctx, overview(ctx, { sel: "pc:Eleceed" }), detailSheet(ctx, { openPush: true })) },
      { id: "detail2", title: "Series detail · remove from target", desc: "Removing a whole series lives only here, red, next to Rename. Two clicks; the second names the count. It also stops syncing the series (otherwise the next plan copies it straight back); the series then sits at the bottom of the ledger under Not synced, with Include to bring it back. Its removals still go through Review.", render: (ctx) => frame(ctx, overview(ctx, { sel: "pc:Eleceed" }), detailSheet(ctx, { armRemove: true })) },
      { id: "recheck", title: "Re-check menu", desc: "Re-check and Verify are one button. The menu holds the two checking choices and a Re-check button that runs with them. Read back is the old Verify.", render: (ctx) => frame(ctx, overview(ctx, { menu: "recheck" }), "") },
      { id: "targetmenu", title: "Target settings menu", desc: "The sliders button next to Re-check: Removals (Guarded / Add only) as a quick switch, and the full editor below it.", render: (ctx) => frame(ctx, overview(ctx, { menu: "target" }), "") },
      { id: "connected", title: "Target panel · only-on · settling · pending", desc: "“All Galaxy Tab S9 settings…” opens the connected target's editor as a sheet. Ledger bottom: folders only on Galaxy Tab S9. Selection bar shows the settling countdown; Frieren's row shows a selection in flight.", render: (ctx) => frame(ctx, overview(ctx, { deviceOnly: true, settling: true, tile: "only" }), connectedSheet(ctx)) },
      { id: "prune", title: "Remove folders", desc: "Prune is its own action with an explicit per-folder list; preserved folders can't be ticked.", render: (ctx) => frame(ctx, overview(ctx, { deviceOnly: true, tile: "only" }), pruneDialog(ctx)) },
      { id: "review", title: "Review before Start", desc: "Groups by kind and reason (click a group to open it), one loss tick per series, separate mass acknowledgement, capacity line, rebind name choice. Start stays disabled until every confirmation is ticked.", render: (ctx) => frame(ctx, overview(ctx), reviewDialog(ctx, {})) },
      { id: "review2", title: "Review · confirmed + mass removal", desc: "After ticking, and the variant where a plan crosses the mass-removal threshold.", render: (ctx) => frame(ctx, overview(ctx), reviewDialog(ctx, { ackLoss: true, ackRepush: true, massDelete: true })) },
      { id: "progress", title: "Progress", desc: "The selection bar becomes the progress dock; copy segments fill green as batches land (the transfer lane). Checkboxes lock.", render: (ctx) => frame(ctx, overview(ctx, { progress: true, locked: true, lane: true }), "", { badge: { count: 9, dot: "pulse" } }) },
      { id: "refusals", title: "Refusal panel", desc: "Shown above the tiles, one card per code with its recovery action. All codes listed here.", render: (ctx) => frame({ ...ctx, h: ctx.tall ? 1500 : 1500 }, `<div style="display:flex;flex-direction:column">${targetBar(ctx)}<div class="col" style="padding:12px 16px;gap:10px">${refusals().map((r) => refusalCard(r)).join("")}${refusalCard(refusals()[2], { armed: true })}</div></div>`) },
      { id: "lastrun", title: "Last-run card", desc: "Sits under the target bar until dismissed; one per status. The plan re-runs underneath, so the card keeps the result.", render: (ctx) => frame({ ...ctx, h: 760 }, `<div style="display:flex;flex-direction:column">${targetBar(ctx)}<div class="col" style="padding:12px 16px;gap:8px">${LAST_RUNS.map((r) => lastRunCard(r)).join("")}</div><div style="padding:0 16px"><div class="t11 dim">Failure reasons, as worded in the card: ${Object.values(FAIL_REASONS).join(" · ")}</div></div></div>`) },
      { id: "prompt", title: "Connect prompt", desc: "Corner card, bottom-right of whatever tab is open; it never blocks. Variants below the first frame.", render: (ctx) => frame(ctx, `<div style="padding:20px" class="dim t13">(Library tab content)</div>`, P(ctx, "ready"), { badge: { count: 9 }, active: "library" }) },
      { id: "promptvars", title: "Connect prompt · variants", desc: "Ready · first sync · preparing · two targets · unauthorized · no permissions · authorizing · connecting.", render: (ctx) => `<div style="display:grid;grid-template-columns:repeat(auto-fill,340px);gap:12px">${["ready", "firstSync", "preparing", "multi", "unauthorized", "noperm", "authorizing", "connecting"].map((k) => `<div class="app ${ctx.dark ? "dk" : ""}" style="width:340px;display:block;border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .14)">${promptBody(PROMPTS[k])}</div>`).join("")}</div>` },
    ],
  };
})();

const DIRS=[A];
// Review-desk shell: direction / screen / theme / width / height / strip-palette controls.
// DIRS is defined by the build (all three directions for review, one for the approved file).
const SHARED = (railPos) => [
  { id: "set-off", title: "Settings → Sync (off)", desc: "Only the switch and an explainer while off. Second frame: switched on but not saved yet.", render: (ctx) => appFrame({ ...ctx, railPos, active: "settings", title: "Settings", badge: {}, body: settingsOff(ctx.alt) }), alt: true },
  { id: "set-on", title: "Settings → Sync (on)", desc: "Device Sync, adb (candidates, Browse, Re-detect, tracking state), Sync defaults, target list. The second frame shows the adb tracking states.", render: (ctx) => appFrame({ ...ctx, railPos, active: "settings", title: "Settings", body: settingsOn(ctx.alt ? "error" : "tracking") }), alt: true, extra: (ctx) => `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px">${["connecting", "polling", "stopped", "error"].map((k) => `<div class="app ${ctx.dark ? "dk" : ""}" style="display:block;padding:4px 14px 12px">${adbSection(k).replace(/<div class="card"[\s\S]*$/, "")}</div>`).join("")}</div>` },
  { id: "set-targets", title: "Settings → Targets", desc: "Every target, one expanded in the shared target editor. Second frame: an identity edit (folder) waiting for its two-click confirm, the remote folder browser open, and Forget history armed.", render: (ctx) => appFrame({ ...ctx, railPos, active: "settings", title: "Settings", h: 1500, body: settingsTargets({ wide: ctx.wide, identityConfirm: ctx.alt, browser: ctx.alt, armedForget: ctx.alt }) }), alt: true },
  { id: "set-adv", title: "Settings → Advanced", desc: "Error budget, size warning, chapter patterns with a live label preview, diagnostic log.", render: (ctx) => appFrame({ ...ctx, railPos, active: "settings", title: "Settings", h: 700, body: settingsAdvanced() }) },
  { id: "rail", title: "Rail badge", desc: "Count of series with pre-selected changes · pulsing dot while a job runs · red dot on a problem (refusal, unauthorized tablet, failed last run).", render: (ctx) => `<div class="row" style="gap:14px;align-items:flex-start">${[[{ count: 9 }, "9 series to sync"], [{ count: 9, dot: "pulse" }, "Copying"], [{ dot: "red" }, "Needs attention"], [{}, "Nothing to do"]].map(([b, l]) => `<div class="col" style="gap:6px;align-items:center"><div class="app ${ctx.dark ? "dk" : ""}" style="height:430px;width:66px">${railHtml(railPos, "new", b)}</div><span style="font-size:11.5px;color:var(--pg-dim)">${l}</span></div>`).join("")}</div>` },
  { id: "library", title: "Library extras", desc: "First frame: the grid's bottom-right cover chip (tablet + count pending, tablet + check synced, dim tablet on no target yet, nothing when not mirrored). Never orange: orange is “N new”. Second frame: DetailView, where a Sync line joins the per-series facts under the file stats, with Open in Sync.", render: (ctx) => ctx.alt ? libraryDetail(ctx.dark, ctx.wide, railPos) : libraryGrid(ctx.dark, ctx.wide, railPos), alt: true },
];
const SHARED_FIND = (railPos, host) => ({ id: "find", title: "Find sources", desc: "Single: Search opens prefilled with a banner. Batch: device covers, editable query, then this review table.", render: (ctx) => appFrame({ ...ctx, railPos, active: ctx.alt ? "search" : "sync", title: ctx.alt ? "Search" : "Sync", body: ctx.alt ? `${findSearchBanner()}<div style="padding:12px 16px"><div class="input row" style="gap:8px">${I("search", "ic-s dim")}Dungeon Meshi</div><div class="t12 dim" style="margin-top:10px">(Search results as today)</div></div>` : host(ctx) }), alt: true });

let state = { dir: "A", screen: "overview", theme: "both", width: "narrow", height: "min", pal: "blue", quiet: false };
try { Object.assign(state, JSON.parse(localStorage.getItem("syncmock") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("syncmock", JSON.stringify(state)); } catch (e) {} };

function dirScreens(d) {
  const shared = SHARED(d.railPos);
  return [...d.screens, d.find ? SHARED_FIND(d.railPos, d.find) : null, ...shared].filter(Boolean);
}
function segCtl(key, opts) {
  return `<span class="seg-ctl" role="group">${opts.map(([v, l]) => `<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${String(state[key]) === String(v)}">${l}</button>`).join("")}</span>`;
}
function render() {
  const dirs = DIRS;
  if (!dirs.find((d) => d.id === state.dir)) state.dir = dirs[0].id;
  const d = dirs.find((x) => x.id === state.dir);
  const screens = dirScreens(d);
  if (!screens.find((s) => s.id === state.screen)) state.screen = screens[0].id;
  const scr = screens.find((s) => s.id === state.screen);
  // The approved build (one direction) locks the strip palette to the decision: blue copy, green on-target.
  if (dirs.length === 1) { state.pal = "blue"; state.quiet = false; }
  document.body.className = `pal-${state.pal} ${state.quiet ? "quiet" : ""}`;
  const themes = state.theme === "both" ? [false, true] : [state.theme === "dark"];
  const ctxBase = { wide: state.width === "wide", tall: state.height === "tall" };
  const frames = [];
  for (const dark of themes) {
    frames.push(`<div><p class="frame-cap">${dark ? "dark" : "light"} · ${ctxBase.wide ? "wide window 1345 px (content ~1280)" : "minimum window 800 px (content ~735)"}</p><div class="frame-wrap">${scr.render({ ...ctxBase, dark })}</div></div>`);
    if (scr.alt) frames.push(`<div><p class="frame-cap">${dark ? "dark" : "light"} · second state</p><div class="frame-wrap">${scr.render({ ...ctxBase, dark, alt: true })}</div></div>`);
    if (scr.extra) frames.push(`<div><p class="frame-cap">${dark ? "dark" : "light"} · more states</p><div class="frame-wrap">${scr.extra({ ...ctxBase, dark })}</div></div>`);
  }
  document.getElementById("desk").innerHTML = `
    <div class="desk-top">
      <div class="desk-row"><h1 class="desk-title">Device Sync mockups</h1><span class="desk-sub">${dirs.length > 1 ? "Three directions inside the app's own tokens. Pick one, or mix parts." : "Approved direction: Transfer Desk (rev 4, 2026-10-16). Blue = will copy, green = on target."}</span></div>
      <div class="desk-row">
        ${dirs.length > 1 ? `<span><span class="ctl-label">Direction</span>${segCtl("dir", dirs.map((x) => [x.id, x.name]))}</span>` : ""}
        <span><span class="ctl-label">Theme</span>${segCtl("theme", [["light", "Light"], ["dark", "Dark"], ["both", "Both"]])}</span>
        <span><span class="ctl-label">Width</span>${segCtl("width", [["narrow", "735 px"], ["wide", "Wide"]])}</span>
        <span><span class="ctl-label">Height</span>${segCtl("height", [["min", "550 min"], ["tall", "Tall"]])}</span>
      </div>
      ${dirs.length > 1 ? `<div class="desk-row">
        <span><span class="ctl-label">“Will copy” colour</span>${segCtl("pal", [["blue", "Blue (primary)"], ["teal", "Teal token"], ["violet", "Violet token"], ["orange", "Orange (old)"]])}</span>
        <span><span class="ctl-label">“On target”</span>${segCtl("quiet", [["false", "Green"], ["true", "Quiet grey"]])}</span>
      </div>` : ""}
      <nav class="scr-nav" aria-label="Screens">${screens.map((s) => `<button type="button" data-screen="${s.id}" aria-current="${s.id === scr.id}">${s.title}</button>`).join("")}</nav>
    </div>
    <p class="dir-pitch">${d.pitch}</p>
    <div class="scr-head"><h2>${scr.title}</h2><p>${scr.desc}</p></div>
    <div class="frames">${frames.join("")}</div>`;
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-k]");
  if (b) { let v = b.dataset.v; if (v === "true" || v === "false") v = v === "true"; state[b.dataset.k] = v; save(); render(); return; }
  const s = e.target.closest("[data-screen]");
  if (s) { state.screen = s.dataset.screen; save(); render(); window.scrollTo({ top: 0 }); return; }
  // Small in-mock interactions: checkboxes and switches toggle, so ticking a confirmation reads naturally.
  const c = e.target.closest("[data-cbx]");
  if (c && !c.classList.contains("locked")) { const on = !c.classList.contains("on"); c.classList.toggle("on", on); c.classList.remove("mixed"); c.innerHTML = on ? CHECK : ""; c.setAttribute("aria-checked", on); return; }
  const w = e.target.closest("[data-sw]");
  if (w) { w.classList.toggle("on"); w.setAttribute("aria-checked", w.classList.contains("on")); }
});
render();
</script>
</body>
</html>
